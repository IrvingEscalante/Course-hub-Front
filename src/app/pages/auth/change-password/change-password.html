<main>
    <div class="email-verification-container flex-column">
        <div class="form-container">
            <form class="form-send-email flex-column">
                <h1 for="" class="text-title-send-email bold">Cambiar contraseña</h1>
                <div class="form-group flex-column">
                    <label for="code-verification">Ingrese su nueva contraseña.</label>
                    <input type="email" formControlName="emailverify" class="input-style" placeholder="Ingrese la nueva contraseña" id="password">
                </div>
                <div class="form-group flex-column">
                    <label for="code-verification">Confirme su nueva contraseña.</label>
                    <input type="email" formControlName="emailverify" class="input-style" placeholder="confirme la nueva contraseña" id="confirmpassword">
                </div>
                <div class="buttons flex-row">
                    <button class="button-access button-secondary" type="submit" >Cancelar</button>
                    <button class="button-access" type="submit" >Cambiar</button>
                </div>
            </form>

        </div>
    </div>
</main>
