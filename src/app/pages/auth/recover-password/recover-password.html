<main>
    <div class="email-verification-container flex-column">
        <div class="form-container">
            <form class="form-send-email flex-column">
                <h1 for="" class="text-title-send-email bold">Recuperar contraseña</h1>
                <p>Por favor ingrese la dirección de correo electrónico asociada con su cuenta de usuario. Le enviaremos un correo electrónico con instrucciones sobre como restablecer su contraseña.</p>
                <div class="form-group flex-column">
                    <input type="email" formControlName="emailverify" class="input-style" placeholder="Ingrese el correo electronico">
                </div>
                <div class="buttons flex-row">
                    <button class="button-access button-secondary" type="submit" >Cancelar</button>
                    <button class="button-access" type="submit" >Enviar</button>
                </div>
            </form>

        </div>
    </div>
</main>
