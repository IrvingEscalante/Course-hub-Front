<main>

    <div class="edit-profile-container flex-column">   
        <h1>Editar perfil</h1>
        <p>Mantén privados tus datos personales. Cualquier usuario va a poder ver la información que agregues en tu perfil.</p>
        <div class="container-edit flex-column">
            <div class="change-photo flex-row">
                <img class="photo-user" src="https://i.pinimg.com/736x/60/82/a0/6082a02c43178b3586604e642c3f100a.jpg" alt="">
                <button class="change-button">Cambiar</button>
            </div>
            <form class="form-edit flex-column">
                <div class="input-edit flex-column">
                    <label for="">Nombre(s)</label>
                    <input type="text">
                </div>
                <div class="input-edit flex-column">
                    <label for="">Apellidos(s)</label>
                    <input type="text">
                </div>
                <div class="input-edit flex-column">
                    <label for="">Biografia</label>
                    <input type="text">
                </div>
                <div class="input-edit flex-column">
                    <label for="">Nombre de usuario</label>
                    <input type="text">
                </div>
            </form>
        </div>
    </div>

</main>
