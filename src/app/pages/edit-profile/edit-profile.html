<main>
  <div class="edit-profile-container flex-column">
    <h1>Editar Perfil</h1>
    <p class="subtitle">Actualiza tu información personal.</p>

    <div class="container-edit flex-column">
      <div class="change-photo flex-column">
        <div class="photo-wrapper flex-column">
          <img class="photo-user" src="https://i.pinimg.com/736x/60/82/a0/6082a02c43178b3586604e642c3f100a.jpg" alt="Foto de usuario">
          <button class="change-button button-access">Cambiar foto</button>
        </div>
      </div>

      <form class="form-edit flex-column">
        <div class="inputs-2column flex-row">
            <div class="input-group">
                <label>Nombre</label>
                <input type="text" placeholder="Ana">
            </div>
            <div class="input-group">
                <label>Apellidos</label>
                <input type="text" placeholder="López">
            </div>
        </div>
        <div class="inputs-2column flex-row">
            <div class="input-group">
            <label>Correo electrónico</label>
            <input type="email" placeholder="ana.lopez@email.com">
            </div>
            <div class="input-group">
            <label>Nombre de usuario</label>
            <input type="text" placeholder="@analopez">
            </div>
        </div>
        <div class="input-group">
          <label>Biografía</label>
          <textarea placeholder="Cuéntanos un poco sobre ti..."></textarea>
        </div>
        <div class="inputs-2column flex-row">
            <div class="input-group">
            <label>Cambiar contraseña</label>
            <input type="password" placeholder="Si no desea cambiarla, deje en blanco este espacio">
            </div>
            <div class="input-group">
            <label>Confirmar contraseña</label>
            <input type="password" placeholder="Cambiar contraseña">
            </div>
        </div>

        <button class="button-access">Guardar Cambios</button>
      </form>
    </div>
  </div>
</main>
