<div class="course-card flex-column">
    <div class="favorite-container">
        <button class="favorite-btn" (click)="toggleFavorite()">
            <svg width="24" height="22" viewBox="0 0 24 22" [attr.fill]="isFavorite ? '#3B82F6' : 'none'"  xmlns="http://www.w3.org/2000/svg">
                <path d="M20.8401 3.60999C20.3294 3.099 19.7229 2.69364 19.0555 2.41708C18.388 2.14052 17.6726 1.99817 16.9501 1.99817C16.2276 1.99817 15.5122 2.14052 14.8448 2.41708C14.1773 2.69364 13.5709 3.099 13.0601 3.60999L12.0001 4.66999L10.9401 3.60999C9.90843 2.5783 8.50915 1.9987 7.05012 1.9987C5.59109 1.9987 4.19181 2.5783 3.16012 3.60999C2.12843 4.64169 1.54883 6.04096 1.54883 7.49999C1.54883 8.95903 2.12843 10.3583 3.16012 11.39L12.0001 20.23L20.8401 11.39C21.3511 10.8792 21.7565 10.2728 22.033 9.60535C22.3096 8.93789 22.4519 8.22248 22.4519 7.49999C22.4519 6.77751 22.3096 6.0621 22.033 5.39464C21.7565 4.72718 21.3511 4.12075 20.8401 3.60999Z" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>

        </button>
    </div>
    <div class="image-container">
        <img class="image-course" [src]="course?.image" alt="imagen" width="260px" loading="lazy">
    </div>
    <div class="course-info flex-column">
        <a [routerLink]="'/course/detail/'+course?.id_course" class="name-course bold">{{course?.name_course}}</a>
        <div class="user-creator-info flex-row">
            <a [routerLink]="'/'+course?.user?.username"><img class="photo-creator" [src]="avatarUrl" alt="Img"></a>
            <span class="name-creator">By {{course?.user?.username}}</span>
        </div>
        <p class="description-course">{{course?.description_course}}</p>
        <div class="rating-course flex-row">
            <div class="rating-course flex-row">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M7.37533 14.8542L10.0003 13.2708L12.6253 14.875L11.9378 11.875L14.2503 9.875L11.2087 9.60417L10.0003 6.77083L8.79199 9.58333L5.75033 9.85417L8.06283 11.875L7.37533 14.8542ZM4.85449 18.3333L6.20866 12.4792L1.66699 8.54167L7.66699 8.02083L10.0003 2.5L12.3337 8.02083L18.3337 8.54167L13.792 12.4792L15.1462 18.3333L10.0003 15.2292L4.85449 18.3333Z" fill="#FFD700"/>
                </svg>
                <span class="rating bold">{{course?.avg_rating}}</span>
            </div>
            @if (course?.is_forked){
                <p class="forked-from">Forked from {{course?.author?.username}}</p>
            }
        </div>
    </div>
</div>
