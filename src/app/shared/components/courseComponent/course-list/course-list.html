@if (courseList) {
<div class="carousel-container">
        @if (hasOverflow) {
        <button class="carousel-btn left" (click)="scrollLeft()">‹</button>
        }
        <h1 class="courses-desc">{{title}}</h1>
        <div class="carousel-track" #carouselTrack>
            @for (course of courseList; track $index) {
                <div class="carousel-item">
                    <app-course-card [course]="course"></app-course-card>
                </div>
            }
        </div>
        @if (hasOverflow) {
            <button class="carousel-btn right" (click)="scrollRight()">›</button>
        }
</div>
}
