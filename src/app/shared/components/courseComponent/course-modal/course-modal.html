@if (isOpen) {
<div class="modal-overlay" (click)="handleClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title">{{ getModalTitle() }}</h2>
      <button class="close-button" (click)="handleClose()" type="button">
        <span class="material-icons">close</span>
      </button>
    </div>

    <div class="modal-body">
      <form [formGroup]="form" (ngSubmit)="handleSubmit()">
        <div class="form-group">
          <label for="title">Título *</label>
          <input 
            type="text" 
            id="title" 
            formControlName="title"
            placeholder="Ingrese el título"
            required
          />
        </div>

        <div class="form-group">
          <label for="description">Descripción *</label>
          <textarea 
            id="description" 
            formControlName="description"
            rows="4"
            placeholder="Ingrese la descripción"
            required
          ></textarea>
        </div>

        @if (shouldShowFileInput()) {
        <div class="form-group">
          <label for="file">Archivo {{ actionType === 'add' ? '*' : '(opcional)' }}</label>
          <div class="file-input-wrapper">
            <input 
              type="file" 
              id="file" 
              (change)="onFileSelected($event)"
              [required]="actionType === 'add'"
              accept=".pdf,.doc,.docx,.ppt,.pptx,.txt"
            />
            @if (selectedFileName) {
            <span class="file-name">{{ selectedFileName }}</span>
            }
          </div>
        </div>
        }

        <div class="modal-footer">
          <button type="button" class="btn btn-cancel" (click)="handleClose()">
            Cancelar
          </button>
          <button type="submit" class="btn btn-submit" [disabled]="!isFormValid()">
            {{ actionType === 'add' ? 'Agregar' : 'Guardar' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
}
