<div class="modal-backdrop" (click)="close()"></div>

<div class="followers-modal">
    <div class="header">
        <h2>{{ title }}</h2>
        <button class="close-btn" (click)="close()">✕</button>
    </div>

    <div class="followers-list">
        @for (u of users; track $index) {
            <div class="user-row">
                <div class="left">
                    <a [routerLink]='"/"+u.username'><app-avatar [size]="48" [name]="u.name" [photo]="u.photo"></app-avatar></a>
                    <div class="user-info">
                        <span class="name">{{ u.name }} {{ u.lastname }}</span>
                        <span class="username">@{{ u.username }}</span>
                    </div>
                </div>

                <button 
                    class="follow-btn" 
                    [class.unfollow]="u.is_following" 
                    (click)="followUnfollow(u.username)">
                    {{ u.is_following ? 'Siguiendo' : 'Seguir' }}
                </button>
            </div>
        }
    </div>
</div>
