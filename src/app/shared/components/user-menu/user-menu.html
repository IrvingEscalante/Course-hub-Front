<div class="menu-profile flex-column">
    <div class="detail-user flex-row">
        <div class="container-image">
            <app-avatar [size]="50" [name]="user.name" [photo]="user.photo"></app-avatar>
        </div>
        <div class="data-user flex-column">
            <strong class="name-user bold">{{user.name.concat(' ', user.lastname)}}</strong>
            <p class="email-user">{{user.email}}</p>
        </div>
    </div>
    <div class="action-buttons flex-column">
        <a class="link-myprofile bold flex-row" (click)="Profile()"><span class="material-icons">person</span>Mi perfil</a>
        <div class="line-space"></div>
        <button class="button-logout bold flex-row" (click)="logout()"><span class="material-icons">logout</span>Cerrar sesión</button>
    </div>
</div>
